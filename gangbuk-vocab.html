                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
            }
        }

            document.getElementById('study-en').innerText = item.en;
            document.getElementById('study-ko').innerText = item.ko;
            
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === vocabulary.length - 1;

            if (!isMeaningVisible) {
                document.getElementById('study-ko').style.visibility = 'hidden';
            } else {
                document.getElementById('study-ko').style.visibility = 'visible';
            }
        }

        function toggleMeaning() {
            isMeaningVisible = !isMeaningVisible;
            document.getElementById('study-ko').style.visibility = isMeaningVisible ? 'visible' : 'hidden';
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateWordDisplay();
            }
        }

        function nextWord() {
            if (currentIndex < vocabulary.length - 1) {
                currentIndex++;
                updateWordDisplay();
            }
        }

        // 탭 전환
        function switchTab(tab) {
            const studyMode = document.getElementById('study-mode');
            const quizMode = document.getElementById('quiz-mode');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tab === 'study') {
                studyMode.classList.remove('hidden');
                quizMode.classList.add('hidden');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                studyMode.classList.add('hidden');
                quizMode.classList.remove('hidden');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
                startQuiz();
            }
        }

        // 퀴즈 시스템
        function startQuiz() {
            quizCurrentQuestion = 0;
            quizScore = 0;
            // 무작위 10개 단어 추출
            const shuffled = [...vocabulary].sort(() => 0.5 - Math.random());
            currentQuizData = shuffled.slice(0, 10);
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            document.getElementById('next-quiz-btn').style.display = 'none';
            const q = currentQuizData[quizCurrentQuestion];
            document.getElementById('quiz-num').innerText = `문제 ${quizCurrentQuestion + 1} / 10`;
            document.getElementById('quiz-en').innerText = q.en;

            // 보기 생성 (정답 1개 + 오답 3개)
            const wrongOptions = vocabulary
                .filter(item => item.en !== q.en)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(item => item.ko);

            const options = [q.ko, ...wrongOptions].sort(() => 0.5 - Math.random());
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText === q.ko);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, isCorrect) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                quizScore++;
            } else {
                selectedBtn.classList.add('wrong');
                // 정답 표시
                options.forEach(btn => {
                    if (btn.innerText === currentQuizData[quizCurrentQuestion].ko) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('next-quiz-btn').style.display = 'block';
        }

        function nextQuizQuestion() {
            quizCurrentQuestion++;
            if (quizCurrentQuestion < currentQuizData.length) {
                renderQuizQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            const card = document.querySelector('#quiz-mode .card');
            card.innerHTML = `
                <h2>퀴즈 완료! 🎉</h2>
                <p style="font-size: 1.2rem; margin: 20px 0;">
                    점수: <strong>${quizScore * 10}점</strong> (${quizScore} / 10 문제 맞춤)
                </p>
                <button class="btn" onclick="location.reload()">다시 도전하기</button>
            `;
            document.getElementById('next-quiz-btn').style.display = 'none';
        }

        // 초기화
        updateWordDisplay();
    </script>
</body>
</html>
