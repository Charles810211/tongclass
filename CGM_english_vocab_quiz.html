<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중학 영어 학습 & 퀴즈 센터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 py-6 px-4">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-6 sm:p-8 flex justify-between items-center relative overflow-hidden">
      <div>
        <span class="inline-block px-3 py-1 bg-indigo-500 text-indigo-100 text-xs font-semibold rounded-full mb-2">Lesson 07 & 08</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold">영어 단어 학습 & 퀴즈 센터</h1>
        <p class="text-indigo-200 text-sm mt-1">Spend Wisely & Wonders of Space Travel</p>
      </div>
      <button id="sound-toggle" class="p-3 bg-indigo-500 hover:bg-indigo-400 rounded-full transition-colors flex items-center justify-center text-xl shadow" title="음향 효과 ON/OFF">
        🔊
      </button>
    </header>

    <!-- Main Navigation Bar -->
    <nav class="bg-slate-50 border-b border-slate-200 flex justify-around p-2 text-sm sm:text-base font-bold">
      <button id="nav-flashcard" class="px-4 py-2 rounded-lg text-indigo-600 bg-indigo-50 transition-all">🎴 플래시카드</button>
      <button id="nav-mcq" class="px-4 py-2 rounded-lg text-slate-600 hover:text-indigo-600 transition-all">📝 5지선다 퀴즈</button>
      <button id="nav-spelling" class="px-4 py-2 rounded-lg text-slate-600 hover:text-indigo-600 transition-all">✍️ 주관식 스펠링</button>
    </nav>

    <!-- Main Content Area -->
    <main class="p-6 sm:p-8">

      <!-- ================= 1. FLASHCARD SECTION ================= -->
      <section id="sec-flashcard" class="block">
        <div class="flex justify-between items-center mb-6">
          <span id="fc-counter" class="px-3 py-1 bg-indigo-100 text-indigo-700 font-bold text-sm rounded-md">카드 1 / 52</span>
          <button id="fc-shuffle-btn" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
            🔀 순서 섞기
          </button>
        </div>

        <!-- Flashcard Container -->
        <div class="perspective-1000 w-full h-80 mb-6 cursor-pointer" id="fc-card-container">
          <div id="fc-card" class="w-full h-full relative transform-style-3d transition-transform duration-500 shadow-md rounded-2xl border border-slate-200">
            
            <!-- Front Side -->
            <div class="absolute inset-0 w-full h-full bg-white rounded-2xl p-6 flex flex-col justify-between items-center text-center backface-hidden">
              <span class="text-xs font-bold text-indigo-500 uppercase tracking-widest">English Word</span>
              <div class="my-auto">
                <h2 id="fc-word" class="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-2">affect</h2>
                <p id="fc-meaning" class="text-slate-500 text-base sm:text-lg">영향을 미치다</p>
              </div>
              <span class="text-xs text-slate-400 italic">💡 카드를 클릭하면 영영풀이와 예문을 확인합니다.</span>
            </div>

            <!-- Back Side -->
            <div class="absolute inset-0 w-full h-full bg-indigo-950 text-white rounded-2xl p-6 flex flex-col justify-between items-center text-center backface-hidden rotate-y-180">
              <span class="text-xs font-bold text-indigo-300 uppercase tracking-widest">English Definition & Example</span>
              <div class="my-auto space-y-4">
                <p id="fc-def" class="text-base sm:text-lg font-medium text-indigo-100 italic leading-relaxed px-2">"to influence someone or something"</p>
                <div class="border-t border-indigo-800 pt-3">
                  <p id="fc-ex" class="text-xs sm:text-sm text-indigo-300">Your opinion will affect many people.</p>
                </div>
              </div>
              <span class="text-xs text-indigo-400 italic">💡 카드를 클릭하면 앞면으로 돌아갑니다.</span>
            </div>

          </div>
        </div>

        <!-- Flashcard Controls -->
        <div class="flex justify-between gap-4 max-w-sm mx-auto">
          <button id="fc-prev" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl text-slate-700 transition-all">← 이전</button>
          <button id="fc-next" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl text-white transition-all">다음 →</button>
        </div>
      </section>

      <!-- ================= 2. 5지선다 퀴즈 SECTION ================= -->
      <section id="sec-mcq" class="hidden">
        
        <!-- Setup Screen -->
        <div id="mcq-setup" class="text-center py-6">
          <h2 class="text-2xl font-bold text-slate-800 mb-2
