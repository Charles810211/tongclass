<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 EBS 수능완성 영어 동반의어 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile touch & view height tweaks */
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            overscroll-behavior-y: none;
        }

        /* Custom Scrollbar for sleek UI */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Flashcard 3D flip styling */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Touch optimized button press feedback */
        .btn-active:active {
            transform: scale(0.96);
            transition: transform 0.08s ease;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20 md:pb-6 select-none">

    <header class="sticky top-0 z-30 bg-gradient-to-r from-indigo-700 via-indigo-600 to-cyan-600 text-white shadow-md px-4 py-3 sm:py-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold fa-book-bookmark text-xl text-yellow-300"></i>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold leading-tight">2027 EBS 수능완성</h1>
                    <p class="text-xs text-indigo-100 font-medium">영어 동반의어 완전정복 (01강~10강)</p>
                </div>
            </div>
            <div class="bg-indigo-800/60 backdrop-blur px-2.5 py-1 rounded-full text-xs font-bold border border-indigo-400/30">
                <span id="totalWordCount">0</span>개 단어
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-3 sm:p-4 space-y-3">

        <!-- Controls: Chapter Select & Search Bar -->
        <section class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="chapterSelect" class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">강 선택 (Chapter)</label>
                    <select id="chapterSelect" onchange="filterVocabulary()" class="w-full text-xs sm:text-sm font-semibold bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">전체보기 (01강~10강)</option>
                        <option value="01">01강 : 글의 목적 / 요지</option>
                        <option value="02">02강 : 주제 / 제목</option>
                        <option value="03">03강 : 함축적 의미 추론</option>
                        <option value="04">04강 : 도표 / 내용 일치</option>
                        <option value="05">05강 : 어법 / 어휘</option>
                        <option value="06">06강 : 빈칸 추론 (1)</option>
                        <option value="07">07강 : 빈칸 추론 (2)</option>
                        <option value="08">08강 : 무관한 문장 / 순서</option>
                        <option value="09">09강 : 문장 삽입 / 요약</option>
                        <option value="10">10강 : 장문 독해</option>
                    </select>
                </div>
                <div>
                    <label for="searchInput" class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">단어 검색 (Search)</label>
                    <div class="relative">
                        <input type="text" id="searchInput" oninput="filterVocabulary()" placeholder="단어, 뜻, 동/반의어..." class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl pl-2.5 pr-7 py-2 text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="clearSearch()" class="absolute right-2 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-list" class="tab-content block">
            <div id="wordListContainer" class="space-y-2.5">
                <!-- Dynamically Populated -->
            </div>
        </section>

        <section id="tab-flashcard" class="tab-content hidden">
            <div class="flex flex-col items-center space-y-4">
                
                <!-- Progress & Chapter indicator -->
                <div class="w-full flex justify-between items-center px-1 text-xs font-bold text-slate-500">
                    <span id="flashcardChapterBadge" class="bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full">01강</span>
                    <span id="flashcardProgress">1 / 10</span>
                </div>

                <!-- Flip Card Container -->
                <div class="w-full h-80 perspective-1000 cursor-pointer" onclick="flipFlashcard()">
                    <div id="flashcardInner" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-lg border border-slate-200 bg-white">
                        
                        <!-- Front Side -->
                        <div class="absolute inset-0 backface-hidden flex flex-col justify-between p-6 bg-gradient-to-b from-white to-indigo-50/30 rounded-3xl">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-400" id="flashcardNoFront">No. 1</span>
                                <button onclick="event.stopPropagation(); speakWordCurrent();" class="p-3 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 btn-active text-lg shadow-sm" title="발음 듣기">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                            <div class="text-center my-auto">
                                <h2 id="flashcardWord" class="text-3xl font-black text-slate-800 tracking-tight mb-2">normal</h2>
                                <p class="text-xs text-indigo-500 font-semibold"><i class="fa-solid fa-hand-pointer mr-1"></i> 터치하여 뜻과 동/반의어 확인</p>
                            </div>
                            <div class="text-center text-[11px] text-slate-400 font-medium">EBS 수능완성 핵심 단어</div>
                        </div>

                        <!-- Back Side -->
                        <div class="absolute inset-0 backface-hidden rotate-y-180 flex flex-col justify-between p-6 bg-slate-900 text-white rounded-3xl">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                <span class="text-xs font-semibold text-slate-400" id="flashcardNoBack">No. 1</span>
                                <button onclick="event.stopPropagation(); speakWordCurrent();" class="p-2.5 bg-slate-800 text-cyan-400 rounded-full hover:bg-slate-700 btn-active text-base" title="발음 듣기">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                            <div class="my-auto space-y-3 text-left">
                                <div>
                                    <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-1">한글 뜻</span>
                                    <p id="flashcardMeaning" class="text-xl font-bold text-yellow-300">정상의, 일반적인</p>
                                </div>
                                <div class="space-y-1.5 pt-1 border-t border-slate-800">
                                    <div class="flex items-start space-x-2 text-xs">
                                        <span class="px-1.5 py-0.5 rounded bg-emerald-900/60 text-emerald-400 font-bold shrink-0">유의어</span>
                                        <span id="flashcardSyn" class="text-emerald-200 font-medium">typical, natural, standard</span>
                                    </div>
                                    <div class="flex items-start space-x-2 text-xs">
                                        <span class="px-1.5 py-0.5 rounded bg-rose-900/60 text-rose-400 font-bold shrink-0">반의어</span>
                                        <span id="flashcardAnt" class="text-rose-200 font-medium">abnormal, unusual, strange</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right text-[11px] text-slate-500">터치하여 다시 뒤집기</div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="w-full flex items-center justify-between gap-3 pt-2">
                    <button onclick="prevFlashcard()" class="flex-1 py-3 bg-white border border-slate-200 rounded-2xl text-slate-700 font-bold text-sm shadow-sm hover:bg-slate-50 btn-active">
                        <i class="fa-solid fa-chevron-left mr-1"></i> 이전
                    </button>
                    <button onclick="speakWordCurrent()" class="px-4 py-3 bg-cyan-500 text-white rounded-2xl font-bold text-sm shadow-sm hover:bg-cyan-600 btn-active">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button onclick="nextFlashcard()" class="flex-1 py-3 bg-indigo-600 text-white rounded-2xl font-bold text-sm shadow-md hover:bg-indigo-700 btn-active">
                        다음 <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>

            </div>
        </section>

        <section id="tab-quiz" class="tab-content hidden">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
                
                <!-- Quiz Setup Panel -->
                <div class="space-y-2 border-b border-slate-100 pb-3">
                    <div class="flex justify-between items-center">
                        <label for="quizModeSelect" class="text-xs font-bold text-slate-600">🎯 퀴즈 유형 선택</label>
                        <span id="quizScoreDisplay" class="text-xs font-extrabold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full border border-indigo-200">
                            점수: 0 / 0
                        </span>
                    </div>
                    <select id="quizModeSelect" onchange="resetQuiz()" class="w-full text-xs sm:text-sm font-bold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="synonym">🟢 동의어(유의어) 맞히기 퀴즈</option>
                        <option value="antonym">🔴 반의어 맞히기 퀴즈</option>
                        <option value="meaning">🟡 한글 뜻 맞히기 퀴즈</option>
                        <option value="mixed">🔀 혼합 랜덤 퀴즈 (유/반/뜻)</option>
                    </select>
                </div>

                <!-- Quiz Card Container -->
                <div id="quizCard" class="space-y-4 pt-1">
                    <div class="text-center space-y-2 py-2 bg-slate-50 rounded-xl p-3 border border-slate-100">
                        <div id="quizQuestionType" class="text-xs font-bold text-indigo-600 uppercase tracking-wide">
                            다음 단어의 [동의어]를 고르세요
                        </div>
                        <div class="flex items-center justify-center space-x-2">
                            <h3 id="quizTargetWord" class="text-2xl font-black text-slate-800">activate</h3>
                            <button onclick="speakQuizWord()" class="p-2 text-indigo-600 bg-white rounded-full shadow-sm hover:bg-indigo-50 text-sm border border-slate-200 btn-active">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <p id="quizTargetContext" class="text-xs text-slate-500 font-medium">01강 어휘</p>
                    </div>

                    <!-- Multiple Choice Options -->
                    <div id="quizOptions" class="grid grid-cols-1 gap-2.5">
                        <!-- Dynamic Buttons -->
                    </div>

                    <!-- Feedback & Explanation Box -->
                    <div id="quizFeedback" class="min-h-[50px] p-3 rounded-xl text-xs font-bold text-center flex items-center justify-center bg-slate-100 text-slate-600">
                        선택지를 클릭하여 정답을 확인하세요.
                    </div>

                    <!-- Next Question Button -->
                    <button id="nextQuizBtn" onclick="generateQuizQuestion()" class="w-full py-3 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow-md hover:bg-indigo-700 btn-active hidden flex items-center justify-center space-x-2">
                        <span>다음 문제 풀기</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg">
        <div class="max-w-md mx-auto grid grid-cols-3 h-14">
            <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center justify-center text-indigo-600 font-bold text-xs space-y-1 btn-active">
                <i class="fa-solid fa-list-ul text-lg"></i>
                <span>단어장</span>
            </button>
            <button onclick="switchTab('flashcard')" id="nav-flashcard" class="flex flex-col items-center justify-center text-slate-400 font-semibold text-xs space-y-1 btn-active">
                <i class="fa-solid fa-clone text-lg"></i>
                <span>플래시카드</span>
            </button>
            <button onclick="switchTab('quiz')" id="nav-quiz" class="flex flex-col items-center justify-center text-slate-400 font-semibold text-xs space-y-1 btn-active">
                <i class="fa-solid fa-pen-to-square text-lg"></i>
                <span>맞춤 퀴즈</span>
            </button>
        </div>
    </nav>

            { ch: "08", no: "10", word: "stagnant", meaning: "침체된, 고여 있는", syn: "inactive, sluggish, inert", ant: "dynamic, active, vibrant" },

            { ch: "09", no: "1", word: "access", meaning: "접근권, 이용 기회", syn: "entry, admission, approach", ant: "exclusion, denial, restriction" },
            { ch: "09", no: "2", word: "available", meaning: "구할 수 있는, 이용 가능한", syn: "accessible, obtainable, present", ant: "unobtainable, unavailable, restricted" },
            { ch: "09", no: "3", word: "allocate", meaning: "할당하다, 배분하다", syn: "assign, distribute, allot", ant: "withhold, retain, keep" },
            { ch: "09", no: "4", word: "equity", meaning: "공평, 공정", syn: "fairness, impartiality, justice", ant: "inequity, unfairness, bias" },

            { ch: "09", no: "8", word: "comprehensive", meaning: "포괄적인, 종합적인", syn: "inclusive, exhaustive, thorough", ant: "limited, partial, narrow" },
            { ch: "09", no: "9", word: "restrict", meaning: "제한하다, 한정하다", syn: "limit, curb, constrain", ant: "expand, release, liberate" },
            { ch: "09", no: "10", word: "subsidize", meaning: "보조금을 지급하다", syn: "fund, finance, support", ant: "tax, penalize" },

            // --- 10강 ---
            { ch: "10", no: "1", word: "assign", meaning: "배정하다, 부여하다", syn: "allocate, designate, appoint", ant: "withdraw, revoke, cancel" },
            { ch: "10", no: "2", word: "sore", meaning: "아픈, 쑤시는", syn: "painful, aching, tender", ant: "painless, comfortable, soothing" },
            { ch: "10", no: "3", word: "monotonous", meaning: "단조로운, 지루한", syn: "tedious, repetitive, dull", ant: "diverse, exciting, varied" },
            { ch: "10", no: "4", word: "adversity", meaning: "역경, 불행", syn: "hardship, misfortune, distress", ant: "prosperity, blessing, fortune" },
            { ch: "10", no: "5", word: "reluctance", meaning: "마지못해 함, 꺼림", syn: "unwillingness, hesitation, aversion", ant: "eagerness, willingness, readiness" },
            { ch: "10", no: "6", word: "empathy", meaning: "공감, 감정이입", syn: "compassion, sympathy, understanding", ant: "apathy, indifference, coldness" },
            { ch: "10", no: "7", word: "contemplate", meaning: "숙고하다, 응시하다", syn: "ponder, consider, meditate", ant: "disregard, ignore, overlook" },
            { ch: "10", no: "8", word: "spontaneous", meaning: "자발적인, 즉흥적인", syn: "impromptu, instinctive, natural", ant: "planned, calculated, artificial" },
            { ch: "10", no: "9", word: "vague", meaning: "모호한, 희미한", syn: "indistinct, obscure, ambiguous", ant: "clear, precise, distinct" },
            { ch: "10", no: "10", word: "resilient", meaning: "회복력 있는, 회복 빠른", syn: "buoyant, tough, adaptable", ant: "fragile, vulnerable, delicate" }
        ];

        // Global App State
        let currentFilteredList = [...fullVocabulary];
        let currentFlashcardIndex = 0;
        let isCardFlipped = false;
        let quizState = {
            score: 0,
            total: 0,
            currentQuestion: null
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('totalWordCount').innerText = fullVocabulary.length;
            filterVocabulary();
            initQuiz();
        });

        // Speech Synthesis Function (TTS)
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slightly slower speed for clearer CSAT learning
                window.speechSynthesis.speak(utterance);
            } else {
                alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
            }
        }

        function speakWordCurrent() {
            if (currentFilteredList.length > 0) {
                speakWord(currentFilteredList[currentFlashcardIndex].word);
            }
        }

        function speakQuizWord() {
            if (quizState.currentQuestion) {
                speakWord(quizState.currentQuestion.wordObj.word);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            // Reset Tab Buttons
            const tabs = ['list', 'flashcard', 'quiz'];
            tabs.forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    navBtn.className = "flex flex-col items-center justify-center text-indigo-600 font-bold text-xs space-y-1 btn-active";
                } else {
                    navBtn.className = "flex flex-col items-center justify-center text-slate-400 font-semibold text-xs space-y-1 btn-active";
                }
            });

            if (tabId === 'flashcard') {
                resetFlashcardView();
            } else if (tabId === 'quiz' && !quizState.currentQuestion) {
                generateQuizQuestion();
            }
        }

        function filterVocabulary() {
            const chVal = document.getElementById('chapterSelect').value;
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            currentFilteredList = fullVocabulary.filter(item => {
                const matchCh = (chVal === 'all' || item.ch === chVal);
                const matchSearch = item.word.toLowerCase().includes(searchVal) ||
                                    item.meaning.toLowerCase().includes(searchVal) ||
                                    item.syn.toLowerCase().includes(searchVal) ||
                                    item.ant.toLowerCase().includes(searchVal);
                return matchCh && matchSearch;
            });

            renderWordList();
            currentFlashcardIndex = 0;
            resetFlashcardView();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterVocabulary();
        }

        function renderWordList() {
            const container = document.getElementById('wordListContainer');
            container.innerHTML = '';

            if (currentFilteredList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-magnifying-glass text-3xl text-slate-300 mb-2"></i>
                        <p class="text-xs text-slate-500 font-bold">검색 결과가 없습니다.</p>
                    </div>
                `;
                return;
            }

            currentFilteredList.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 hover:border-indigo-200 transition-all space-y-2";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-extrabold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">${item.ch}강</span>
                            <span class="text-xs text-slate-400 font-bold">No.${item.no}</span>
                            <h3 class="text-lg font-black text-slate-800 tracking-tight">${item.word}</h3>
                        </div>
                        <button onclick="speakWord('${item.word}')" class="p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-full text-xs font-bold btn-active" title="발음 재생">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-indigo-900">${item.meaning}</p>
                    </div>
                    <div class="grid grid-cols-1 gap-1 pt-1 border-t border-slate-100 text-xs">
                        <div class="flex items-start space-x-1.5">
                            <span class="px-1.5 py-0.2 rounded bg-emerald-50 text-emerald-700 font-extrabold shrink-0">유의어</span>
                            <span class="text-emerald-900 font-medium">${item.syn}</span>
                        </div>
                        <div class="flex items-start space-x-1.5">
                            <span class="px-1.5 py-0.2 rounded bg-rose-50 text-rose-700 font-extrabold shrink-0">반의어</span>
                            <span class="text-rose-900 font-medium">${item.ant}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function flipFlashcard() {
            const inner = document.getElementById('flashcardInner');
            isCardFlipped = !isCardFlipped;
            if (isCardFlipped) {
                inner.classList.add('rotate-y-180');
            } else {
                inner.classList.remove('rotate-y-180');
            }
        }

        function resetFlashcardView() {
            isCardFlipped = false;
            document.getElementById('flashcardInner').classList.remove('rotate-y-180');
            
            if (currentFilteredList.length === 0) {
                document.getElementById('flashcardWord').innerText = "단어 없음";
                document.getElementById('flashcardMeaning').innerText = "-";
                document.getElementById('flashcardSyn').innerText = "-";
                document.getElementById('flashcardAnt').innerText = "-";
                document.getElementById('flashcardProgress').innerText = "0 / 0";
                return;
            }

            const item = currentFilteredList[currentFlashcardIndex];
            document.getElementById('flashcardChapterBadge').innerText = `${item.ch}강 어휘`;
            document.getElementById('flashcardNoFront').innerText = `No. ${item.no}`;
            document.getElementById('flashcardNoBack').innerText = `No. ${item.no}`;
            document.getElementById('flashcardWord').innerText = item.word;
            document.getElementById('flashcardMeaning').innerText = item.meaning;
            document.getElementById('flashcardSyn').innerText = item.syn;
            document.getElementById('flashcardAnt').innerText = item.ant;
            document.getElementById('flashcardProgress').innerText = `${currentFlashcardIndex + 1} / ${currentFilteredList.length}`;
        }

        function nextFlashcard() {
            if (currentFilteredList.length === 0) return;
            currentFlashcardIndex = (currentFlashcardIndex + 1) % currentFilteredList.length;
            resetFlashcardView();
        }

        function prevFlashcard() {
            if (currentFilteredList.length === 0) return;
            currentFlashcardIndex = (currentFlashcardIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
            resetFlashcardView();
        }

        function initQuiz() {
            quizState = { score: 0, total: 0, currentQuestion: null };
            updateQuizScoreUI();
        }

        function resetQuiz() {
            initQuiz();
            generateQuizQuestion();
        }

        function updateQuizScoreUI() {
            document.getElementById('quizScoreDisplay').innerText = `점수: ${quizState.score} / ${quizState.total}`;
        }

        function generateQuizQuestion() {
            if (fullVocabulary.length < 4) return;

            document.getElementById('nextQuizBtn').classList.add('hidden');
            const feedbackBox = document.getElementById('quizFeedback');
            feedbackBox.className = "min-h-[50px] p-3 rounded-xl text-xs font-bold text-center flex items-center justify-center bg-slate-100 text-slate-600";
            feedbackBox.innerText = "정답이라고 생각되는 보기 버튼을 클릭하세요.";

            // Determine Quiz Mode
            let selectedMode = document.getElementById('quizModeSelect').value;
            if (selectedMode === 'mixed') {
                const modes = ['synonym', 'antonym', 'meaning'];
                selectedMode = modes[Math.floor(Math.random() * modes.length)];
            }

            // Pick Target Word Object
            const sourcePool = currentFilteredList.length >= 4 ? currentFilteredList : fullVocabulary;
            const target = sourcePool[Math.floor(Math.random() * sourcePool.length)];

            let questionText = "";
            let correctAnswer = "";

            if (selectedMode === 'synonym') {
                questionText = "다음 단어의 [동의어/유의어]를 고르세요";
                correctAnswer = target.syn.split(',')[0].trim();
            } else if (selectedMode === 'antonym') {
                questionText = "다음 단어의 [반의어]를 고르세요";
                correctAnswer = target.ant.split(',')[0].trim();
            } else { // meaning
                questionText = "다음 단어의 [한글 뜻]을 고르세요";
                correctAnswer = target.meaning;
            }

            // Generate 4 District Options
            const options = [correctAnswer];
            while (options.length < 4) {
                const randItem = fullVocabulary[Math.floor(Math.random() * fullVocabulary.length)];
                let cand = "";
                if (selectedMode === 'synonym') cand = randItem.syn.split(',')[0].trim();
                else if (selectedMode === 'antonym') cand = randItem.ant.split(',')[0].trim();
                else cand = randItem.meaning;

                if (cand && cand !== "-" && !options.includes(cand)) {
                    options.push(cand);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            quizState.currentQuestion = {
                wordObj: target,
                mode: selectedMode,
                correctAnswer: correctAnswer,
                options: options
            };

            // Render Question UI
            document.getElementById('quizQuestionType').innerText = questionText;
            document.getElementById('quizTargetWord').innerText = target.word;
            document.getElementById('quizTargetContext').innerText = `${target.ch}강 단어`;

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full py-3 px-4 text-left font-bold text-xs sm:text-sm bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl transition-all btn-active text-slate-800 flex items-center justify-between";
                btn.onclick = () => checkQuizAnswer(btn, opt);
                btn.innerHTML = `
                    <span><strong class="text-indigo-600 mr-2">${idx + 1}.</strong> ${opt}</span>
                    <i class="fa-regular fa-circle text-slate-300"></i>
                `;
                optionsContainer.appendChild(btn);
            });

            // Automatically speak word on question load
            speakWord(target.word);
        }

        function checkQuizAnswer(selectedBtn, selectedVal) {
            const current = quizState.currentQuestion;
            if (!current) return;

            // Disable all option buttons
            const buttons = document.querySelectorAll('#quizOptions button');
            buttons.forEach(btn => btn.disabled = true);

            quizState.total++;
            const isCorrect = (selectedVal === current.correctAnswer);
            const feedbackBox = document.getElementById('quizFeedback');

            if (isCorrect) {
                quizState.score++;
                selectedBtn.className = "w-full py-3 px-4 text-left font-bold text-xs sm:text-sm bg-emerald-50 border-2 border-emerald-500 rounded-xl text-emerald-900 flex items-center justify-between";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-600 text-base";
                
                feedbackBox.className = "min-h-[50px] p-3 rounded-xl text-xs font-bold text-center flex items-center justify-center bg-emerald-100 text-emerald-800 border border-emerald-200";
                feedbackBox.innerHTML = `🎉 정답입니다! (${current.wordObj.word} : ${current.wordObj.meaning})`;
            } else {
                selectedBtn.className = "w-full py-3 px-4 text-left font-bold text-xs sm:text-sm bg-rose-50 border-2 border-rose-500 rounded-xl text-rose-900 flex items-center justify-between";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-600 text-base";

                // Highlight correct button
                buttons.forEach(btn => {
                    if (btn.innerText.includes(current.correctAnswer)) {
                        btn.className = "w-full py-3 px-4 text-left font-bold text-xs sm:text-sm bg-emerald-50 border-2 border-emerald-400 rounded-xl text-emerald-900 flex items-center justify-between";
                    }
                });

                feedbackBox.className = "min-h-[50px] p-3 rounded-xl text-xs font-bold text-center flex items-center justify-center bg-rose-100 text-rose-800 border border-rose-200";
                feedbackBox.innerHTML = `💡 오답입니다! 정답: <span class="underline ml-1">${current.correctAnswer}</span><br>(${current.wordObj.word} = ${current.wordObj.meaning})`;
            }

            updateQuizScoreUI();
            document.getElementById('nextQuizBtn').classList.remove('hidden');
        }
    </script>
