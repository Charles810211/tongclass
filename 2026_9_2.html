            { no: "39-3", word: "precautions", meaning: "예방 조치", syn: "preventive measures, safeguards, preventive actions", ant: "risks, hazards, negligence" },
            { no: "40-1", word: "retain", meaning: "유지하다", syn: "maintain, preserve, keep", ant: "lose, abandon, relinquish" },
            { no: "40-2", word: "perpetuating", meaning: "영속시키기", syn: "sustaining, maintaining, continuing", ant: "ending, terminating, discontinuing" },
            { no: "40-3", word: "motivate", meaning: "동기를 부여하다", syn: "encourage, inspire, prompt", ant: "discourage, deter, demotivate" },
            { no: "40-4", word: "generous", meaning: "관대한", syn: "giving, charitable, liberal", ant: "stingy, selfish, ungenerous" },
            { no: "41-1", word: "popularized", meaning: "대중화된", syn: "promoted, publicized, disseminated", ant: "suppressed, obscured, restricted" },
            { no: "41-2", word: "sophisticated", meaning: "정교한", syn: "advanced, complex, elaborate", ant: "simple, basic, rudimentary" },
            { no: "41-3", word: "beneficial", meaning: "유익한", syn: "advantageous, favorable, helpful", ant: "harmful, detrimental, disadvantageous" },
            { no: "41-4", word: "underlying", meaning: "잠재적인", syn: "hidden, implicit, concealed", ant: "apparent, explicit, overt" },
            { no: "41-5", word: "autonomy", meaning: "자율성", syn: "independence, self-determination, self-governance", ant: "dependence, subordination, control" },
            { no: "41-6", word: "deliberate", meaning: "의도적인", syn: "intentional, purposeful, conscious", ant: "unintentional, accidental, inadvertent" },
            { no: "41-7", word: "cultivate", meaning: "기르다", syn: "develop, foster, nurture", ant: "neglect, hinder, suppress" }
        ];

        let currentVocabList = [...vocabData];
        let currentIndex = 0;
        let isFlipped = false;

        // Init App
        document.getElementById('total-vocab-count').innerText = vocabData.length;
        updateCard();

        function switchMode(mode) {
            const studySec = document.getElementById('study-section');
            const quizSec = document.getElementById('quiz-section');
            const navStudy = document.getElementById('nav-study');
            const navQuiz = document.getElementById('nav-quiz');

            if (mode === 'study') {
                studySec.classList.remove('hidden');
                quizSec.classList.add('hidden');
                navStudy.className = "px-3 py-1.5 rounded-lg text-sm font-semibold transition bg-indigo-700 text-white shadow";
                navQuiz.className = "px-3 py-1.5 rounded-lg text-sm font-semibold transition hover:bg-indigo-500 text-indigo-100";
            } else {
                studySec.classList.add('hidden');
                quizSec.classList.remove('hidden');
                navQuiz.className = "px-3 py-1.5 rounded-lg text-sm font-semibold transition bg-indigo-700 text-white shadow";
                navStudy.className = "px-3 py-1.5 rounded-lg text-sm font-semibold transition hover:bg-indigo-500 text-indigo-100";
            }
        }

        function updateCard() {
            if (currentVocabList.length === 0) return;
            const item = currentVocabList[currentIndex];
            
            document.getElementById('card-no').innerText = `#${item.no}`;
            document.getElementById('card-word').innerText = item.word;
            document.getElementById('card-meaning-front').innerText = item.meaning;
            document.getElementById('card-word-back-title').innerText = item.word;
            document.getElementById('card-synonyms').innerText = item.syn;
            document.getElementById('card-antonyms').innerText = item.ant;
            document.getElementById('card-index-indicator').innerText = `${currentIndex + 1} / ${currentVocabList.length}`;

            if (isFlipped) flipCard();
        }

        function flipCard() {
            const inner = document.getElementById('card-inner');
            isFlipped = !isFlipped;
            if (isFlipped) {
                inner.classList.add('rotate-y-180');
            } else {
                inner.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            if (currentIndex < currentVocabList.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function speakCurrent() {
            if (currentVocabList.length === 0) return;
            const text = currentVocabList[currentIndex].word;
            speakWord(text);
        }

        function speakQuizWord() {
            if (quizQuestions.length === 0) return;
            const text = quizQuestions[currentQuizIndex].word;
            speakWord(text);
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function filterVocab() {
            const query = document.getElementById('search-input').value.toLowerCase();
            currentVocabList = vocabData.filter(v => 
                v.word.toLowerCase().includes(query) || 
                v.meaning.includes(query) ||
                v.syn.toLowerCase().includes(query)
            );
            currentIndex = 0;
            updateCard();
        }

        // QUIZ LOGIC
        let quizQuestions = [];
        let currentQuizIndex = 0;
        let score = 0;
        let quizType = 'synonym';

        function startQuiz(type) {
            quizType = type;
            document.getElementById('quiz-setup').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');

            // Generate 10 Random Questions
            let pool = vocabData.filter(v => {
                if (type === 'synonym') return v.syn && v.syn !== '-';
                if (type === 'antonym') return v.ant && v.ant !== '-';
                return true;
            });

            pool = pool.sort(() => 0.5 - Math.random());
            quizQuestions = pool.slice(0, 10);
            currentQuizIndex = 0;
            score = 0;

            showQuestion();
        }

        function showQuestion() {
            if (currentQuizIndex >= quizQuestions.length) {
                finishQuiz();
                return;
            }

            const item = quizQuestions[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `문제 ${currentQuizIndex + 1} / ${quizQuestions.length}`;
            document.getElementById('quiz-score').innerText = `점수: ${score}`;
            document.getElementById('quiz-question-word').innerText = item.word;
            
            const typeBadge = document.getElementById('quiz-type-badge');
            if (quizType === 'synonym') typeBadge.innerText = "동의어 퀴즈";
            else if (quizType === 'antonym') typeBadge.innerText = "반의어 퀴즈";
            else typeBadge.innerText = "뜻 맞추기 퀴즈";

            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('next-quiz-btn').classList.add('hidden');

            // Generate Options
            let correctAnswer = "";
            if (quizType === 'synonym') correctAnswer = item.syn.split(',')[0].trim();
            else if (quizType === 'antonym') correctAnswer = item.ant.split(',')[0].trim();
            else correctAnswer = item.meaning;

            let options = [correctAnswer];
            
            // Pick 3 wrong options
            while (options.length < 4) {
                let randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                let wrongVal = "";
                if (quizType === 'synonym') wrongVal = randomItem.syn.split(',')[0].trim();
                else if (quizType === 'antonym') wrongVal = randomItem.ant.split(',')[0].trim();
                else wrongVal = randomItem.meaning;

                if (wrongVal && wrongVal !== '-' && !options.includes(wrongVal)) {
                    options.push(wrongVal);
                }
            }

            options.sort(() => 0.5 - Math.random());

            const container = document.getElementById('quiz-options');
            container.innerHTML = "";

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 border-2 border-slate-200 rounded-xl font-semibold hover:border-indigo-500 hover:bg-indigo-50 transition flex justify-between items-center";
                btn.innerHTML = `<span>${idx + 1}. ${opt}</span> <i class="fa-regular fa-circle text-slate-300"></i>`;
                btn.onclick = () => selectOption(btn, opt, correctAnswer);
                container.appendChild(btn);
            });
        }

        function selectOption(btn, selected, correct) {
            const allButtons = document.querySelectorAll('#quiz-options button');
            allButtons.forEach(b => b.disabled = true);

            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');

            if (selected === correct) {
                btn.className = "w-full text-left p-3.5 border-2 border-emerald-500 bg-emerald-50 text-emerald-800 rounded-xl font-semibold flex justify-between items-center";
                feedback.className = "p-3 rounded-xl text-center font-bold bg-emerald-100 text-emerald-800";
                feedback.innerText = "정답입니다! 👏";
                score += 10;
            } else {
                btn.className = "w-full text-left p-3.5 border-2 border-rose-500 bg-rose-50 text-rose-800 rounded-xl font-semibold flex justify-between items-center";
                feedback.className = "p-3 rounded-xl text-center font-bold bg-rose-100 text-rose-800";
                feedback.innerText = `아쉽네요. 정답은 [ ${correct} ] 입니다!`;
            }

            document.getElementById('quiz-score').innerText = `점수: ${score}`;
            document.getElementById('next-quiz-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuizIndex++;
            showQuestion();
        }

        function finishQuiz() {
            const quizBox = document.getElementById('quiz-box');
            quizBox.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <i class="fa-solid fa-trophy text-5xl text-amber-400"></i>
                    <h2 class="text-2xl font-extrabold text-slate-800">퀴즈 완료!</h2>
                    <p class="text-lg text-slate-600">최종 점수: <strong class="text-indigo-600 text-2xl">${score} / 100점</strong></p>
                    <button onclick="location.reload()" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition">
                        다시 시작하기
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
